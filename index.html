<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Beyond the Postcard | 明信片之外的希腊 — Philhellene 希友</title>
<!-- No external font requests: Google Fonts is blocked in mainland China,
     so every font-family below falls through to fonts already installed
     on the device (PingFang SC / Microsoft YaHei / Noto Sans CJK for
     Chinese, system serif/sans-serif for English). Nothing is fetched
     over the network. -->
<style>
  :root{
    color-scheme: light;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --navy:#14335C;
    --navy-soft:#5D7391;
    --blue:#0071CE;
    --blue-bright:#00AEE0;
    --blue-pale:#E9F4FC;
    --blue-line:#CFE4F3;
    --white:#FFFFFF;
    --paper:#F8FBFE;
    --sand:#FBF2DE;
    --sand-line:#EBDCB9;
    --gold:#B8862B;
    --olive:#5F7A4C;
    --terra:#C05C3E;
    --shadow-sm:0 1px 3px rgba(20,51,92,.07);
    --shadow-md:0 8px 28px rgba(20,51,92,.10);
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--paper); }
  *,*::before,*::after{ box-sizing:inherit; }
  body{ margin:0; min-height:100%; background:var(--paper); color:var(--navy);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  body.zh{ font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Micro Hei','Heiti SC',sans-serif; line-height:1.75; }
  h1,h2,h3{ font-family:Georgia,'Times New Roman',serif; font-weight:600; line-height:1.15; margin:0; color:var(--navy); }
  body.zh h1, body.zh h2, body.zh h3{ font-family:'Songti SC','STSong','SimSun','Noto Serif CJK SC',serif; line-height:1.4; }
  p{ margin:0; }
  button{ font-family:inherit; }

  .app{ max-width:800px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--white); box-shadow:var(--shadow-md); }

  /* ---------- language gate ---------- */
  .gate{ min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:40px 28px;
    background:linear-gradient(180deg,#D7EDFA 0%,#F3FAFE 46%,#FFFFFF 100%); }
  .gate-inner{ max-width:520px; margin:0 auto; width:100%; text-align:center; }
  .gate-mark{ font-size:.76rem; letter-spacing:.18em; text-transform:uppercase; color:var(--blue); margin-bottom:26px; font-weight:700; }
  .gate-art{ width:100%; max-width:340px; margin:0 auto 28px; display:block; }
  .gate h1{ font-size:clamp(1.7rem,5.4vw,2.35rem); margin-bottom:6px; }
  .gate .h1zh{ font-family:'Songti SC','STSong','SimSun','Noto Serif CJK SC',serif; font-weight:600; font-size:clamp(1.35rem,4.4vw,1.75rem); color:var(--navy); margin-bottom:22px; line-height:1.45; }
  .gate .sub{ color:var(--navy-soft); font-size:1rem; line-height:1.65; margin-bottom:6px; }
  .gate .subzh{ color:var(--navy-soft); font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; font-size:.95rem; line-height:1.85; margin-bottom:32px; }
  .lang-row{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:30px; }
  .lang-btn{ flex:1 1 180px; max-width:230px; border:2px solid var(--blue-line); background:#fff; border-radius:16px;
    padding:20px 18px; cursor:pointer; transition:border-color 150ms ease, transform 150ms ease, box-shadow 150ms ease; }
  .lang-btn:hover{ border-color:var(--blue); transform:translateY(-2px); box-shadow:var(--shadow-sm); }
  .lang-btn .big{ display:block; font-size:1.3rem; font-weight:700; color:var(--navy); margin-bottom:3px; }
  .lang-btn .small{ display:block; font-size:.84rem; color:var(--navy-soft); }
  .lang-btn.zh .big{ font-family:'Songti SC','STSong','SimSun',serif; }
  .privacy{ border:1px solid var(--blue-line); background:var(--blue-pale); border-radius:14px; padding:16px 20px; text-align:left; }
  .privacy .row{ display:flex; gap:11px; align-items:flex-start; font-size:.86rem; color:var(--navy-soft); line-height:1.65; }
  .privacy .row + .row{ margin-top:9px; padding-top:9px; border-top:1px solid var(--blue-line); font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; line-height:1.8; }
  .privacy svg{ width:17px; height:17px; flex:none; margin-top:3px; stroke:var(--blue); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .gate-foot{ margin-top:26px; font-size:.76rem; color:var(--navy-soft); opacity:.8; }

  /* ---------- hero ---------- */
  .sky{ position:relative; overflow:hidden; height:min(26vh,196px); min-height:146px;
    background:linear-gradient(180deg,var(--sky-top,#CFEAFA) 0%,var(--sky-bottom,#F4FBFF) 100%); transition:background 600ms ease; }
  .sky .sun{ position:absolute; width:36px; height:36px; border-radius:50%; background:var(--sun-color,#fff);
    transform:translateX(-50%); transition:left 600ms ease, background 600ms ease, box-shadow 600ms ease, bottom 600ms ease; }
  .cloud{ position:absolute; fill:#fff; opacity:.82; }
  .sky svg.skyline{ position:absolute; left:0; right:0; bottom:0; width:100%; height:54%; display:block; }
  .brandmark{ position:absolute; top:16px; left:26px; z-index:3; }
  .brandmark .org{ display:block; font-size:.66rem; letter-spacing:.16em; text-transform:uppercase; color:var(--blue); font-weight:700; }
  .brandmark .word{ display:block; font-family:Georgia,'Times New Roman',serif; font-weight:600; font-size:1.12rem; color:var(--navy); }
  body.zh .brandmark .word{ font-family:'Songti SC','STSong','SimSun',serif; font-weight:700; }
  .langswap{ position:absolute; top:16px; right:22px; z-index:3; background:rgba(255,255,255,.75); border:1px solid var(--blue-line);
    border-radius:999px; padding:5px 13px; font-size:.78rem; color:var(--navy); cursor:pointer; font-weight:600; }

  .track{ height:3px; background:var(--blue-line); }
  .track > div{ height:100%; background:var(--blue-bright); transition:width 360ms ease; }

  .panel{ flex:1; background:var(--white); padding:30px 30px 58px; }
  .panel-inner{ max-width:580px; margin:0 auto; animation:rise 360ms ease both; }
  @keyframes rise{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  @media (prefers-reduced-motion:reduce){ .panel-inner{animation:none} }

  .step-count{ font-size:.82rem; color:var(--navy-soft); margin-bottom:9px; }
  .q-title{ font-size:clamp(1.42rem,4vw,1.92rem); margin-bottom:8px; }
  body.zh .q-title{ font-size:clamp(1.3rem,3.7vw,1.66rem); }
  .q-note{ font-size:.9rem; color:var(--navy-soft); line-height:1.7; margin-bottom:22px; }
  body.zh .q-note{ line-height:1.85; }

  .options{ display:flex; flex-direction:column; gap:10px; margin-bottom:28px; }
  .option{ display:flex; align-items:center; gap:14px; text-align:left; width:100%;
    border:1.5px solid var(--blue-line); background:#fff; color:var(--navy); border-radius:12px; padding:14px 17px; cursor:pointer;
    transition:border-color 140ms ease, background-color 140ms ease; }
  .option:hover{ border-color:var(--blue-bright); background:var(--paper); }
  .option.selected{ border-color:var(--blue); background:var(--blue-pale); }
  .option svg{ width:23px; height:23px; flex:none; stroke:var(--blue); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .option .label{ font-size:1rem; font-weight:500; }
  .option .sub{ display:block; font-size:.8rem; color:var(--navy-soft); font-weight:400; margin-top:2px; line-height:1.5; }

  .chips{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:28px; }
  .chip{ display:flex; align-items:center; gap:8px; border:1.5px solid var(--blue-line); background:#fff; color:var(--navy);
    border-radius:999px; padding:9px 16px; cursor:pointer; font-size:.93rem; font-weight:500;
    transition:border-color 140ms ease, background-color 140ms ease, color 140ms ease; }
  .chip svg{ width:17px; height:17px; stroke:var(--blue); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .chip:hover{ border-color:var(--blue-bright); }
  .chip.selected{ border-color:var(--blue); background:var(--blue); color:#fff; }
  .chip.selected svg{ stroke:#fff; }

  .slider-wrap{ margin-bottom:28px; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:5px; border-radius:3px; background:var(--blue-line); margin:24px 0 14px; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:var(--blue); border:4px solid #fff; box-shadow:var(--shadow-sm); cursor:pointer; }
  input[type=range]::-moz-range-thumb{ width:26px; height:26px; border-radius:50%; background:var(--blue); border:4px solid #fff; cursor:pointer; }
  .slider-labels{ display:flex; justify-content:space-between; gap:18px; }
  .slider-labels span{ font-size:.85rem; color:var(--navy-soft); max-width:16em; line-height:1.55; }
  .slider-labels span:last-child{ text-align:right; }
  .slider-labels span.active{ color:var(--navy); font-weight:700; }

  .nav-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .btn{ border:none; border-radius:999px; padding:13px 28px; font-size:1rem; font-weight:700; cursor:pointer; transition:transform 130ms ease, background-color 130ms ease; }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.36; cursor:not-allowed; }
  .btn-primary{ background:var(--blue); color:#fff; }
  .btn-primary:hover:not(:disabled){ background:#005CAB; }
  .btn-ghost{ background:transparent; color:var(--navy-soft); padding:13px 8px; font-weight:600; }
  .btn-outline{ background:#fff; color:var(--blue); border:1.5px solid var(--blue); border-radius:999px; padding:12px 24px; font-weight:700; cursor:pointer; font-size:.95rem; }

  .hero-copy h1{ font-size:clamp(1.9rem,5.6vw,2.7rem); margin-bottom:16px; }
  .hero-copy p{ font-size:1.02rem; color:var(--navy-soft); margin-bottom:26px; line-height:1.72; }
  body.zh .hero-copy p{ line-height:1.9; }
  .hero-meta{ font-size:.85rem; color:var(--navy-soft); margin-top:14px; line-height:1.6; }

  /* ---------- result ---------- */
  .badge-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .badge{ font-size:.74rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:4px 11px; border-radius:999px; }
  body.zh .badge{ text-transform:none; letter-spacing:.02em; }
  .badge.type{ background:var(--blue-pale); color:var(--blue); }
  .badge.region{ background:var(--sand); color:var(--gold); }
  .badge.quiet{ background:#E8F1E4; color:var(--olive); }

  .place-name{ font-size:clamp(1.8rem,5.6vw,2.4rem); margin-bottom:2px; }
  .place-alt{ font-size:.98rem; color:var(--navy-soft); margin-bottom:18px; }
  body.zh .place-alt{ font-family:Georgia,'Times New Roman',serif; }

  .mapbox{ border:1.5px solid var(--blue-line); border-radius:16px; overflow:hidden; margin-bottom:16px; background:#F2F9FE; }
  .mapbox svg{ display:block; width:100%; height:auto; }
  .dist-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
  .dist{ display:flex; align-items:center; gap:7px; background:var(--paper); border:1px solid var(--blue-line);
    border-radius:10px; padding:8px 13px; font-size:.86rem; color:var(--navy); }
  .dist svg{ width:16px; height:16px; stroke:var(--blue); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .dist b{ font-weight:700; }

  .usp{ background:linear-gradient(135deg,#FDF6E6 0%,#FBF2DE 100%); border:1.5px solid var(--sand-line);
    border-radius:16px; padding:20px 22px; margin-bottom:24px; }
  .usp .ttl{ display:block; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:7px; }
  body.zh .usp .ttl{ letter-spacing:.04em; text-transform:none; }
  .usp p{ font-size:1.06rem; line-height:1.6; color:var(--navy); font-weight:500; }
  body.zh .usp p{ line-height:1.8; }

  .sect{ margin-bottom:24px; }
  .sect h3{ font-size:1.06rem; margin-bottom:9px; display:flex; align-items:center; gap:9px; }
  .sect h3 svg{ width:19px; height:19px; stroke:var(--blue); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .sect p{ font-size:.96rem; line-height:1.78; color:var(--navy); }
  body.zh .sect p{ line-height:1.9; }
  .sect ul{ margin:0; padding-left:20px; }
  .sect li{ font-size:.95rem; line-height:1.78; margin-bottom:6px; }
  body.zh .sect li{ line-height:1.9; }

  .film{ background:#F1F4F8; border-left:3px solid var(--navy); border-radius:0 12px 12px 0; padding:14px 18px; margin-bottom:24px; }
  .film .ttl{ font-size:.74rem; letter-spacing:.12em; text-transform:uppercase; color:var(--navy-soft); font-weight:700; margin-bottom:5px; }
  body.zh .film .ttl{ letter-spacing:.03em; text-transform:none; }
  .film p{ font-size:.94rem; line-height:1.72; }
  body.zh .film p{ line-height:1.88; }

  .food{ background:#F5F8F2; border:1px solid #DFE9D7; border-radius:14px; padding:16px 20px; margin-bottom:24px; }
  .food .ttl{ display:flex; align-items:center; gap:8px; font-weight:700; color:var(--olive); font-size:.95rem; margin-bottom:6px; }
  .food .ttl svg{ width:18px; height:18px; stroke:var(--olive); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .food p{ font-size:.94rem; line-height:1.75; }
  body.zh .food p{ line-height:1.9; }

  .swap{ border:1.5px dashed var(--blue-line); border-radius:14px; padding:16px 20px; margin-bottom:26px; background:var(--paper); }
  .swap .ttl{ font-size:.86rem; font-weight:700; color:var(--blue); margin-bottom:6px; }
  .swap p{ font-size:.92rem; line-height:1.72; color:var(--navy-soft); }
  body.zh .swap p{ line-height:1.9; }
  .meter{ display:flex; align-items:center; gap:10px; margin-top:12px; font-size:.8rem; color:var(--navy-soft); }
  .meter .bar{ flex:1; height:7px; border-radius:4px; background:var(--blue-line); overflow:hidden; }
  .meter .bar i{ display:block; height:100%; border-radius:4px; }

  .more{ display:flex; flex-direction:column; gap:12px; margin-bottom:8px; }
  .more-card{ border:1.5px solid var(--blue-line); border-radius:14px; padding:15px 18px; background:#fff; cursor:pointer; text-align:left; width:100%;
    transition:border-color 140ms ease, background 140ms ease; }
  .more-card:hover{ border-color:var(--blue-bright); background:var(--paper); }
  .more-card .nm{ font-family:Georgia,'Times New Roman',serif; font-weight:600; font-size:1.1rem; color:var(--navy); margin-bottom:3px; }
  body.zh .more-card .nm{ font-family:'Songti SC','STSong','SimSun',serif; }
  .more-card .ds{ font-size:.87rem; color:var(--navy-soft); line-height:1.6; }
  body.zh .more-card .ds{ line-height:1.8; }

  .divider{ height:1px; background:var(--blue-line); margin:30px 0; border:none; }
  .closing{ background:var(--blue-pale); border-radius:16px; padding:22px 24px; margin-bottom:22px; }
  .closing h3{ font-size:1.1rem; margin-bottom:8px; }
  .closing p{ font-size:.93rem; color:var(--navy-soft); line-height:1.75; }
  .closing p sup{ font-size:.62rem; color:var(--blue); font-weight:700; padding:0 1px; }
  .srcnote{ margin:14px 0 0; padding-left:16px; list-style:decimal; }
  .srcnote li{ font-size:.69rem; line-height:1.6; color:#8B9AAB; margin-top:4px; }
  body.zh .srcnote li{ line-height:1.75; }
  .srcnote i{ font-style:italic; }
  body.zh .closing p{ line-height:1.92; }
  .action-row{ display:flex; gap:12px; flex-wrap:wrap; }


  .pcard{ margin-bottom:18px; border-radius:14px; overflow:hidden; box-shadow:0 6px 22px rgba(20,51,92,.14); background:#fff; }
  .pcard svg{ display:block; width:100%; height:auto; }
  .sharecard .sc-pc{ padding:0 14px 2px; }
  .sharecard .sc-pc svg{ display:block; width:100%; height:auto; border-radius:10px; box-shadow:0 3px 12px rgba(20,51,92,.16); }
  .pairbox{ border:2px solid var(--blue); border-radius:16px; padding:20px 22px; margin-bottom:26px; background:var(--blue-pale); }
  .pairbox .ttl{ font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--blue); font-weight:700; margin-bottom:8px; }
  body.zh .pairbox .ttl{ letter-spacing:.04em; text-transform:none; }
  .pairbox p{ font-size:.95rem; line-height:1.72; color:var(--navy); margin-bottom:14px; }
  body.zh .pairbox p{ line-height:1.9; }
  .pairlist{ display:flex; flex-direction:column; gap:9px; }
  .pairbtn{ display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; text-align:left;
    background:#fff; border:1.5px solid var(--blue-line); border-radius:11px; padding:12px 16px; cursor:pointer;
    transition:border-color 140ms ease; }
  .pairbtn:hover{ border-color:var(--blue); }
  .pairbtn .pn{ font-family:Georgia,'Times New Roman',serif; font-weight:600; font-size:1.02rem; color:var(--navy); }
  body.zh .pairbtn .pn{ font-family:'Songti SC','STSong','SimSun',serif; }
  .pairbtn .pw{ font-size:.8rem; color:var(--navy-soft); }
  .pairbtn .arw{ color:var(--blue); font-weight:700; flex:none; }

  .season{ border:1px solid var(--blue-line); border-radius:14px; padding:16px 18px; margin-bottom:24px; }
  .season .ttl{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:.95rem; margin-bottom:12px; }
  .season .ttl svg{ width:18px; height:18px; stroke:var(--blue); fill:none; stroke-width:1.7; stroke-linecap:round; }
  .strip{ display:grid; grid-template-columns:repeat(12,1fr); gap:3px; margin-bottom:10px; }
  .strip div{ text-align:center; font-size:.63rem; font-weight:700; padding:7px 0 6px; border-radius:5px; color:#fff; letter-spacing:.02em; }
  .legend{ display:flex; flex-wrap:wrap; gap:12px; font-size:.76rem; color:var(--navy-soft); }
  .legend span{ display:flex; align-items:center; gap:5px; }
  .legend i{ width:10px; height:10px; border-radius:3px; display:block; }
  .season p{ font-size:.9rem; color:var(--navy-soft); line-height:1.7; margin-top:10px; }
  body.zh .season p{ line-height:1.88; }

  .bridge{ background:#FBF4F2; border:1px solid #EFD9D2; border-radius:14px; padding:16px 20px; margin-bottom:24px; }
  .bridge .ttl{ display:flex; align-items:center; gap:8px; font-weight:700; color:var(--terra); font-size:.95rem; margin-bottom:6px; }
  .bridge .ttl svg{ width:18px; height:18px; stroke:var(--terra); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .bridge p{ font-size:.93rem; line-height:1.9; }

  .overlay{ position:fixed; inset:0; background:rgba(20,51,92,.55); z-index:50; display:flex; align-items:center;
    justify-content:center; padding:24px 18px; overflow-y:auto; }
  .sharewrap{ max-width:340px; width:100%; }
  .sharecard{ background:linear-gradient(170deg,#BEE4F7 0%,#EAF7FE 42%,#FFFFFF 100%); border-radius:20px; overflow:hidden;
    box-shadow:0 16px 48px rgba(0,0,0,.3); }
  .sharecard .sc-top{ padding:20px 22px 0; }
  .sharecard .sc-org{ font-size:.6rem; letter-spacing:.18em; text-transform:uppercase; color:var(--blue); font-weight:700; margin-bottom:12px; }
  .sharecard .sc-eye{ font-size:.76rem; color:var(--navy-soft); margin-bottom:2px; }
  .sharecard .sc-name{ font-family:Georgia,'Times New Roman',serif; font-weight:700; font-size:1.7rem; color:var(--navy); line-height:1.15; margin-bottom:3px; }
  body.zh .sharecard .sc-name{ font-family:'Songti SC','STSong','SimSun',serif; }
  .sharecard .sc-alt{ font-size:.78rem; color:var(--navy-soft); margin-bottom:14px; }
  .sharecard .sc-map{ padding:0 14px; }
  .sharecard .sc-map svg{ display:block; width:100%; height:auto; border-radius:12px; }
  .sharecard .sc-body{ background:#fff; padding:16px 22px 20px; }
  .sharecard .sc-usp{ font-size:.86rem; line-height:1.6; color:var(--navy); font-weight:500; margin-bottom:12px; }
  body.zh .sharecard .sc-usp{ line-height:1.8; }
  .sharecard .sc-foot{ display:flex; justify-content:flex-end; align-items:center; font-size:.66rem;
    border-top:1px solid #EAF1F7; padding-top:9px; }
  .sharecard .sc-foot b{ color:#A8C6DC; font-weight:500; letter-spacing:.06em; }
  .share-actions{ display:flex; gap:10px; margin-top:14px; }
  .share-actions button{ flex:1; border-radius:999px; padding:11px 14px; font-size:.88rem; font-weight:700; cursor:pointer; border:none; }
  .sa-copy{ background:#fff; color:var(--navy); }
  .sa-close{ background:rgba(255,255,255,.2); color:#fff; border:1.5px solid rgba(255,255,255,.6) !important; }
  .share-hint{ color:#fff; font-size:.78rem; text-align:center; margin-top:12px; opacity:.9; line-height:1.55; }

  @media (max-width:480px){ .panel{ padding:24px 20px 46px; } .brandmark{ left:20px; } .gate{ padding:32px 20px; } }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function(){
"use strict";

/* =========================================================
   ICONS
   ========================================================= */

/* =========================================================
   DESTINATIONS

var D=[
{id:'nafplio',type:'town',lon:22.80,lat:37.57,pressure:2,dist:1,
 months:'SSGBBGGGBBGS',
 t:{ancient:4,byzantine:4,food:4,nature:2,village:4,art:4,sea:3,living:3},
 en:{name:'Nafplio',alt:'Ναύπλιο · Peloponnese',region:'Peloponnese',
  usp:'The first capital of modern Greece — a whole city of Venetian fortresses, Ottoman fountains and neoclassical balconies, two hours from Athens and skipped by almost everyone racing to Epidaurus.',
  history:'When Greece became a state, this was its seat of government from 1823 to 1834, before the capital moved to Athens. Ioannis Kapodistrias, the country\u2019s first head of state, was assassinated on the steps of St Spyridon church here in 1831 — the bullet hole is still in the doorframe. Above the town, the Venetian fortress of Palamidi is reached by a staircase of roughly a thousand steps; in the harbour sits Bourtzi, a small island castle that was once the home of the town executioner. Half an hour away, the ancient theatre of Epidaurus still stages Greek tragedy every summer, with acoustics so exact a coin dropped on the stage is audible in the back row.',
  food:'Gogges, a hand-rolled pasta twisted around a knitting needle, served with aged cheese. The town sits at the edge of Nemea, Greece\u2019s most important red wine region, where the Agiorgitiko grape has been cultivated since antiquity — Nemea is where Heracles killed the lion.',
  swap:'Most visitors treat the Peloponnese as a day trip from Athens. Staying two or three nights in Nafplio instead turns one rushed coach tour into money that stays in a small town of 14,000 people.'},
 zh:{name:'纳夫普利翁',alt:'Nafplio · 伯罗奔尼撒',region:'伯罗奔尼撒',
  usp:'现代希腊的第一个首都。威尼斯要塞、奥斯曼喷泉与新古典主义阳台层层叠在一起，距雅典仅两小时——却几乎被所有赶往埃皮达鲁斯的游客直接开车略过。',
  history:'1823 至 1834 年，这里是新生希腊国家的首都，之后才迁都雅典。希腊第一任国家元首卡波迪斯特里亚斯于 1831 年在这座城市的圣斯皮里东教堂台阶上遇刺身亡，门框上的弹孔至今还在。城上方的威尼斯帕拉米迪城堡要爬近一千级台阶才能抵达；港口中的布尔奇小岛城堡，曾经是全城刽子手的住所。半小时车程外的埃皮达鲁斯古剧场每年夏天仍在上演古希腊悲剧，声学精确到在舞台上掉一枚硬币，最后一排都能听见。',
  bridge:'一个国家把首都从临时驻地迁往更大的城市，这段历史中国人再熟悉不过：南京之于民国，正如纳夫普利翁之于现代希腊——第一个首都往往不是最终的首都，却留下了最完整的建国记忆。',
  food:'Gogges——一种用织针卷成的手工面食，配陈年奶酪。小城紧邻希腊最重要的红葡萄酒产区内梅亚，当地的 Agiorgitiko 葡萄自古代起就在种植；内梅亚正是神话中赫拉克勒斯斩杀巨狮的地方。',
  swap:'大多数人只把伯罗奔尼撒当作雅典的一日游。改成在纳夫普利翁住上两三晚，一场匆忙的大巴团就变成了留在这座一万四千人小城里的实在收入。'}},

{id:'monemvasia',type:'town',lon:23.05,lat:36.69,pressure:2,dist:3,
 months:'SSGBBGGGBBGS',
 t:{ancient:2,byzantine:5,food:3,nature:3,village:5,art:3,sea:4,living:2},
 en:{name:'Monemvasia',alt:'Μονεμβασιά · Laconia',region:'Peloponnese',
  usp:'A Byzantine fortress town carved into the seaward face of a rock — invisible from the mainland, entered through a single gate, and still inhabited. No cars have ever driven inside it.',
  history:'Founded in 583 AD by Byzantines fleeing Slavic raids, the town clings to a limestone monolith connected to the shore by one causeway; its name means "single entrance." It passed between Byzantines, Venetians, Franks and Ottomans for a thousand years, and was one of the first towns liberated in the 1821 War of Independence. The poet Yannis Ritsos was born inside the walls and is buried just outside them. The upper town, now ruined, still holds the 12th-century church of Agia Sofia on the cliff edge.',
  food:'Malvasia — the sweet wine that took its name from Monemvasia and travelled across medieval Europe as "Malmsey," the wine Shakespeare\u2019s Duke of Clarence drowns in. Local producers revived it in 2010 after a gap of centuries. Also saitia, a fried cheese parcel drizzled with honey.',
  swap:'Monemvasia receives a fraction of the visitors of a comparable Italian hill town. Arriving outside July and August means you may have the upper town entirely to yourself.'},
 zh:{name:'莫奈姆瓦夏',alt:'Monemvasia · 拉科尼亚',region:'伯罗奔尼撒',
  usp:'一座凿在巨岩临海一面的拜占庭要塞城。从陆地上完全看不见它，只有一道城门可以进入，至今仍有人居住——城里从未开进过一辆汽车。',
  history:'公元 583 年，躲避斯拉夫人劫掠的拜占庭人建起了这座城。它攀附在一块石灰岩巨岩上，只靠一条堤道与陆地相连，名字的意思就是"唯一的入口"。此后一千年间，它在拜占庭、威尼斯、法兰克与奥斯曼之间几经易手，也是 1821 年独立战争中最早光复的城镇之一。诗人扬尼斯·里索斯出生在城墙之内，葬在城墙之外。如今已成废墟的上城，悬崖边仍立着 12 世纪的圣索菲亚教堂。',
  bridge:'一座只有一个入口、靠地形自保的城，很容易让人想到平遥或凤凰的城墙逻辑：不是为了壮观，而是为了活下来。不同的是，莫奈姆瓦夏把整座城藏在了一块海中巨岩的背面，从陆地上完全看不见。',
  food:'Malvasia 甜酒——它的名字就来自莫奈姆瓦夏，中世纪时以"Malmsey"之名风行全欧，莎士比亚笔下克拉伦斯公爵正是溺死在这种酒的酒桶里。断代数百年后，本地酒庄在 2010 年重新复原了它。另有 saitia，一种淋蜂蜜的炸奶酪卷。',
  swap:'与体量相当的意大利山城相比，莫奈姆瓦夏的游客量只有零头。避开七八月前来，整座上城很可能只属于你一个人。'}},

{id:'meteora',type:'region',lon:21.63,lat:39.71,pressure:3,dist:3,
 months:'SSGBBGGGBBGS',
 t:{ancient:2,byzantine:5,food:3,nature:5,village:3,art:4,sea:1,living:3},
 en:{name:'Meteora',alt:'Μετέωρα · Thessaly',region:'Central Greece',
  usp:'Six working monasteries balanced on top of sandstone pillars up to 400 metres high. Monks first reached them by rope ladders and nets that were replaced, in the old saying, "only when the Lord let them break."',
  history:'Hermits began living in the rock cavities in the 11th century; the monasteries were built from the 14th century onwards as the Byzantine Empire collapsed and Serbian and Ottoman raids swept Thessaly. Twenty-four were built; six remain active. The frescoes inside — particularly at Varlaam and Great Meteoron — are among the finest post-Byzantine painting anywhere. UNESCO listed the site in 1988 under both cultural and natural criteria, a rare combination.',
  film:'The climactic sequence of the James Bond film For Your Eyes Only (1981) was shot at Holy Trinity Monastery, with Roger Moore scaling the rock face. The monks, unhappy about the filming, hung laundry from the windows to disrupt the shots.',
  food:'Thessaly is hearty mountain cooking: hilopites egg noodles, slow-cooked lamb, and the local tsipouro distilled after the grape harvest. The nearby town of Kalabaka is known for its bean and pork dishes rather than anything coastal.',
  swap:'Meteora is busy at midday when the coaches arrive from Athens and Thessaloniki. Staying overnight in Kastraki gives you sunrise and sunset on the rocks almost alone — and keeps the spending in the village rather than on the bus.'},
 zh:{name:'迈泰奥拉',alt:'Meteora · 色萨利',region:'希腊中部',
  usp:'六座仍在运作的修道院，架在高达四百米的砂岩巨柱顶端。最早的修士靠绳梯和吊网上下，而按当地的老话说，那些绳子"只有在上帝让它断的时候才会换"。',
  history:'11 世纪起，隐修士开始住进岩洞；14 世纪之后，随着拜占庭帝国崩溃、塞尔维亚人与奥斯曼人的劫掠席卷色萨利，修道院被一座座建起。前后共建成二十四座，如今仍有六座在运作。院内的壁画——尤其是瓦尔拉姆与大迈泰奥拉两座——是后拜占庭绘画的最高水准。1988 年，联合国教科文组织同时以文化与自然两项标准将其列入世界遗产，这种双重身份极为罕见。',
  film:'007 电影《最高机密》（For Your Eyes Only，1981）的高潮戏就在圣三一修道院拍摄，罗杰·摩尔徒手攀上岩壁。修士们对剧组进驻颇有意见，特意在窗口晾出衣物来干扰取景。',
  bridge:'把修行之所建在悬崖绝壁上，中国有山西的悬空寺——同样贴着峭壁、同样靠木石与信念撑住。两者相隔七千公里，却都源于同一个念头：离世俗越远，离天越近。',
  food:'色萨利是扎实的山地菜：hilopites 鸡蛋面、慢炖羊肉，以及葡萄收成后蒸馏的本地 tsipouro 烈酒。山脚的卡兰巴卡以豆类和猪肉料理闻名，而非海产。',
  swap:'正午时分，来自雅典和塞萨洛尼基的大巴集中抵达，是迈泰奥拉最拥挤的时候。在山脚的卡斯特拉基住上一晚，日出与日落时分的巨岩几乎只属于你——钱也留在了村子里，而不是留在大巴上。'}},

{id:'delphi',type:'town',lon:22.50,lat:38.48,pressure:3,dist:1,
 months:'SSGBBGGGBBGS',
 t:{ancient:5,byzantine:2,food:3,nature:4,village:3,art:4,sea:2,living:2},
 en:{name:'Delphi',alt:'Δελφοί · Phocis',region:'Central Greece',
  usp:'The place the ancient world believed was the centre of the earth — built on a mountainside so steep that the sanctuary climbs in terraces, with a view running all the way down to the sea.',
  history:'For a thousand years, Greek cities, kings and eventually Roman emperors sent envoys here to ask the Pythia, Apollo\u2019s priestess, what to do. Her answers, famously ambiguous, shaped wars and colonies across the Mediterranean. A stone called the omphalos marked what Zeus determined was the navel of the world, after releasing two eagles from opposite ends of the earth. The site held the Pythian Games, second only to Olympia, and the museum holds the Charioteer — a life-size bronze from 470 BC with eyelashes still intact.',
  food:'Arachova, ten minutes up the mountain, makes formaela — a firm sheep\u2019s cheese sliced and grilled until it blisters, served with lemon. The Parnassos slopes produce mountain honey, trahana and hilopites.',
  swap:'Most people see Delphi in three hours on a coach from Athens and leave. The mountain villages above it — Arachova, Chrisso, Desfina — are barely visited outside ski season, and are where the region\u2019s food actually lives.'},
 zh:{name:'德尔斐',alt:'Delphi · 福基斯',region:'希腊中部',
  usp:'古代世界所认定的"大地中心"。圣域依着陡峭的山坡一层层向上叠起，视线可以一路落到远处的海面。',
  history:'在长达一千年的时间里，希腊各城邦、国王乃至后来的罗马皇帝，都派使节来此向阿波罗的女祭司皮媞亚请示该怎么做。她那些著名的模棱两可的回答，左右了地中海世界的战争与殖民。宙斯从大地两端各放出一只鹰，相遇之处便是"世界的肚脐"，由一块名为 omphalos 的石头标记。这里举办的皮提亚竞技会，地位仅次于奥林匹亚。博物馆中收藏的《驭者》是公元前 470 年的真人大小青铜像，连睫毛都完整保存至今。',
  bridge:'希腊城邦出兵前派使者去德尔斐问神谕，商王出征前则灼烧龟甲、看裂纹定吉凶。安阳出土的十几万片甲骨，本质上就是一部国家级的问卜档案。两个文明都相信：重大决定不该只由人来做。',
  food:'山上十分钟车程的阿拉霍瓦出产 formaela——一种质地紧实的羊奶酪，切片煎到表皮起泡，挤上柠檬即食。帕纳索斯山坡还产山地蜂蜜、trahana 与 hilopites。',
  swap:'大多数人坐大巴从雅典来，花三小时看完德尔斐就走。而山上的阿拉霍瓦、赫里索、德斯菲纳这些村子，除了滑雪季几乎无人到访——那里才是这片山区真正的饮食所在。'}},

{id:'pelion',type:'region',lon:23.10,lat:39.36,pressure:2,dist:2,
 months:'SSGBBGGGBBGS',
 t:{ancient:3,byzantine:3,food:5,nature:5,village:5,art:3,sea:4,living:4},
 en:{name:'Pelion & Volos',alt:'Πήλιο · Thessaly',region:'Central Greece',
  usp:'The mythological home of the centaurs: a mountain ridge of cobbled stone villages with the Aegean on one side and a calm gulf on the other — and the most generous drinking ritual in Greece at its foot.',
  history:'The port of Volos stands on ancient Iolcos, where Jason assembled the Argonauts and sailed for the Golden Fleece. Pelion itself was where Chiron the centaur — the one civilised member of a wild race — tutored Achilles, Jason and Asclepius. The mountain villages of Makrinitsa, Vizitsa and Milies kept their stone mansions and slate roofs because Ottoman rule here was unusually light: Pelion was granted privileges in exchange for supplying silk, and the wealth built schools and libraries. Milies\u2019 library held banned books that helped seed the independence movement.',
  food:'Volos is the capital of the tsipouradiko. You order a small bottle of tsipouro and a plate of meze arrives free; order another and a different plate arrives; the meze changes every round and the afternoon disappears. Up the mountain: spetsofai, country sausage stewed with peppers, and Pelion apples and chestnuts.',
  swap:'Pelion has a full road network, ferries to the Sporades, and almost no international visitors outside August. It is the clearest example in Greece of a region that could comfortably take more people and currently does not get them.'},
 zh:{name:'皮立翁山与沃洛斯',alt:'Pelion & Volos · 色萨利',region:'希腊中部',
  usp:'神话中半人马的故乡：一道山脊上散落着石板铺就的老村，一侧是爱琴海，另一侧是风平浪静的海湾——山脚下则有全希腊最慷慨的饮酒仪式。',
  history:'沃洛斯港建在古代的伊俄尔科斯城上，伊阿宋正是在这里召集阿尔戈英雄、启航去寻找金羊毛。皮立翁山则是半人马喀戎——这个野蛮族群中唯一开化者——教导阿喀琉斯、伊阿宋与医神阿斯克勒庇俄斯的地方。马克里尼察、维齐察、米利耶斯这些山村之所以完整保留了石砌宅邸与石板屋顶，是因为奥斯曼在此的统治异常宽松：皮立翁以供应生丝换来了特权，积累的财富建起了学校与图书馆。米利耶斯图书馆里收藏的禁书，为独立运动埋下了种子。',
  bridge:'皮立翁山脊上那些石板屋顶、依山而筑的村落，与徽州的古村落在气质上惊人地接近——都是靠一段特殊的税赋或商贸特权积累了财富，然后把钱变成了石头、书院和桥。',
  food:'沃洛斯是 tsipouradiko（小酒馆）的首都。你点一小瓶 tsipouro，店家免费送上一碟小菜；再点一瓶，换一碟新的；每一轮的菜都不重样，一个下午就这样过去了。山上则有 spetsofai——乡村香肠炖甜椒，以及皮立翁的苹果和栗子。',
  swap:'皮立翁公路网完整，有渡轮通往斯波拉泽斯群岛，八月之外几乎见不到国际游客。在全希腊，它是"完全有能力接待更多人、却始终没等到人"的最典型例子。'}},

{id:'thessaloniki',type:'city',lon:22.94,lat:40.64,pressure:3,dist:3,
 months:'GGGBBGGGBBGG',
 t:{ancient:4,byzantine:5,food:5,nature:1,village:1,art:5,sea:2,living:5},
 en:{name:'Thessaloniki',alt:'Θεσσαλονίκη · Macedonia',region:'Northern Greece',
  usp:'Greece\u2019s second city and its most layered: Roman rotunda, Byzantine churches, Ottoman baths and the ghost of one of the largest Sephardic Jewish communities in the world, all within a twenty-minute walk — plus the best street food in the country.',
  history:'Founded in 315 BC and named after Alexander the Great\u2019s half-sister. The Rotunda, built as a Roman mausoleum for the emperor Galerius, has been a church, a mosque and a monument in turn; its minaret still stands beside it. Fifteen of the city\u2019s Paleochristian and Byzantine monuments are inscribed by UNESCO. After Spain expelled its Jews in 1492, the Ottoman sultan settled tens of thousands of them here; for four hundred years Thessaloniki was a majority-Jewish city, known as the Mother of Israel, with Ladino spoken in the port. Almost the entire community was deported in 1943. The city was also the birthplace of Mustafa Kemal Atatürk, whose house is now a museum.',
  food:'Bougatsa for breakfast — semolina custard in crackling phyllo, cut with a scraper and dusted with sugar. Then koulouri from a street cart, trigona panoramatos (cream-filled pastry horns), and a long evening in a tsipouro bar where every round brings new meze. The city\u2019s food carries Anatolian and Sephardic memory that Athens does not have.',
  swap:'Thessaloniki receives roughly a tenth of Athens\u2019 international arrivals despite being a 50-minute flight away and an easier city to walk. It is the single most effective way to add a second Greek city to a trip.'},
 zh:{name:'塞萨洛尼基',alt:'Thessaloniki · 马其顿',region:'希腊北部',
  usp:'希腊第二大城，也是层次最厚的一座：罗马圆形大厅、拜占庭教堂、奥斯曼浴场，以及世界上最大的塞法迪犹太社群之一留下的余影——全都在二十分钟步行圈内。街头小吃也是全希腊第一。',
  history:'公元前 315 年建城，以亚历山大大帝同父异母的妹妹命名。圆形大厅最初是罗马皇帝伽列里乌斯的陵墓，此后先后成为教堂、清真寺与纪念建筑，旁边的宣礼塔至今矗立。城中十五处早期基督教与拜占庭遗迹已列入世界遗产。1492 年西班牙驱逐犹太人后，奥斯曼苏丹将其中数万人安置在此；此后四百年，塞萨洛尼基一直是犹太人占多数的城市，被称为"以色列之母"，港口里通行拉迪诺语。1943 年，整个社群几乎被悉数驱逐。这里也是土耳其国父凯末尔的出生地，故居现为博物馆。',
  bridge:'罗马人修建的艾格纳提亚大道由此穿过，把亚得里亚海与君士坦丁堡连在一起——它正是丝绸之路最西端的陆上延伸。从长安出发的丝绸，在走完沙漠与海洋之后，最后一程往往就走在这条路上。',
  food:'早餐是 bougatsa——酥皮里裹着粗麦布丁，用刮刀切开、撒上糖粉。接着是街头推车上的 koulouri 芝麻圈、trigona panoramatos 奶油酥角，然后在 tsipouro 小酒馆里消磨整个夜晚，每一轮酒都配上新的小菜。这座城市的味道里有安纳托利亚与塞法迪的记忆，是雅典没有的。',
  swap:'塞萨洛尼基距雅典只有 50 分钟飞行，城市更适合步行，国际到访量却只有雅典的约十分之一。想在行程里加上第二座希腊城市，它是效率最高的选择。'}},

{id:'vergina',type:'town',lon:22.32,lat:40.48,pressure:2,dist:4,
 months:'SSGBBGGGBBGS',
 t:{ancient:5,byzantine:2,food:4,nature:2,village:3,art:5,sea:1,living:2},
 en:{name:'Vergina & Naoussa',alt:'Βεργίνα · Imathia',region:'Northern Greece',
  usp:'The intact royal tomb of Philip II — Alexander the Great\u2019s father — with his cremated remains still inside a gold casket, displayed underground exactly where it was found. There is rarely a queue.',
  history:'Vergina stands on ancient Aigai, the first capital of Macedon and the burial ground of its kings. In 1977 the archaeologist Manolis Andronikos opened a tomb beneath a large earth mound and found it unlooted — the only unrobbed Macedonian royal tomb ever discovered. Inside were a gold larnax stamped with the Macedonian sun, a gold wreath of oak leaves, iron armour and ivory portrait heads. Philip II was assassinated at Aigai in 336 BC during his daughter\u2019s wedding; Alexander was proclaimed king on the spot. The site became a UNESCO listing in 1996. The museum is built into the mound itself, so you descend into the dark to see the tombs in situ.',
  food:'Nearby Naoussa grows Xinomavro, the grape behind Greece\u2019s most age-worthy red — often compared to Barolo for its tannin and its stubbornness. The region also makes Naoussa peaches and the sweet fried pastry bougatsa served all across Macedonia.',
  swap:'Vergina holds a discovery comparable in significance to Tutankhamun\u2019s tomb and receives a small fraction of the visitors of the Acropolis. Pairing it with Thessaloniki adds one day and an entirely different chapter of Greek history.'},
 zh:{name:'韦尔吉纳与纳乌萨',alt:'Vergina & Naoussa · 伊马夏',region:'希腊北部',
  usp:'腓力二世——亚历山大大帝之父——完好无损的王陵。他火化后的遗骨至今仍装在那只黄金匣中，就在被发现的原位、地下原址展出。这里几乎从不排队。',
  history:'韦尔吉纳所在之处是古代的埃盖，马其顿的第一个首都，也是历代国王的葬地。1977 年，考古学家安德罗尼科斯挖开一座大土丘下的陵墓，发现它从未被盗——这是迄今唯一一座未遭劫掠的马其顿王陵。墓中出土了压印着马其顿太阳纹的黄金骨匣、橡叶黄金花冠、铁甲，以及象牙雕成的肖像头像。公元前 336 年，腓力二世在女儿的婚礼上于埃盖遇刺，亚历山大当场被拥立为王。1996 年，这里被列入世界遗产。博物馆直接建在土丘内部，你要走进黑暗中，才能在原位看见这些陵墓。',
  bridge:'腓力二世墓（前 336 年）未遭盗掘、原封不动地出土，其震撼程度可以直接对照曾侯乙墓（前 433 年）——年代相近，同样完整，同样让人第一次真正看清了一个时代的工艺上限。',
  food:'邻近的纳乌萨种植 Xinomavro 葡萄，酿出希腊最耐陈年的红酒——因其单宁与倔强，常被拿来与巴罗洛相比。这一带还出产纳乌萨蜜桃，以及整个马其顿都吃得到的甜口炸酥皮点心。',
  swap:'韦尔吉纳的发现意义可与图坦卡蒙墓相提并论，游客量却只有卫城的一个零头。把它和塞萨洛尼基串在一起，只多花一天，却补上了希腊历史里完全不同的一章。'}},

{id:'zagori',type:'region',lon:20.85,lat:39.67,pressure:2,dist:4,
 months:'SSGBBGGGBBGS',
 t:{ancient:1,byzantine:4,food:5,nature:5,village:5,art:3,sea:1,living:4},
 en:{name:'Ioannina & Zagori',alt:'Ιωάννινα · Epirus',region:'Epirus',
  usp:'An Ottoman lakeside city with an inhabited island at its centre, backed by 46 stone villages and the deepest gorge in the world relative to its width.',
  history:'Ioannina was the capital of Ali Pasha, the Albanian-born governor who ruled Epirus semi-independently of the Sultan for thirty years, courted Napoleon and Britain in turn, and was finally cornered and killed on the lake island in 1822 — his severed head sent to Constantinople. Byron visited his court and wrote about it. North of the city, the Zagori villages were granted self-rule under the Ottomans in exchange for guarding the mountain passes; the wealth from that autonomy built arched stone bridges, cobbled mule paths and schools. The Zagori Cultural Landscape was inscribed by UNESCO in 2023, one of Greece\u2019s newest listings. The Vikos Gorge has the greatest depth-to-width ratio of any canyon on earth.',
  food:'Epirus is the land of the pita — not pita bread, but hand-rolled phyllo pies filled with greens, cheese, pumpkin or nettles, a different one in every village. Nearby Metsovo makes smoked Metsovone cheese and Katogi, one of the first serious Greek estate wines. Tsipouro is drunk here with everything.',
  swap:'Epirus is a one-hour flight from Athens and receives fewer international visitors in a year than Santorini receives in a fortnight. The villages have restored guesthouses and empty beds outside August.'},
 zh:{name:'约阿尼纳与扎戈里',alt:'Ioannina & Zagori · 伊庇鲁斯',region:'伊庇鲁斯',
  usp:'一座奥斯曼风格的湖畔城市，湖心有一座至今有人居住的小岛；城市背后是四十六座石砌山村，以及按宽深比计算全世界最深的峡谷。',
  history:'约阿尼纳曾是阿里帕夏的都城。这位出身阿尔巴尼亚的总督半独立于苏丹统治伊庇鲁斯长达三十年，先后与拿破仑和英国周旋，最终于 1822 年在湖心岛上被围杀，头颅被送往君士坦丁堡。拜伦曾造访他的宫廷并写下见闻。城北的扎戈里诸村，因替奥斯曼把守山口而换得自治权，这份自治带来的财富建起了石拱桥、卵石骡道与学校。2023 年，"扎戈里文化景观"被列入世界遗产，是希腊最新的遗产项目之一。维科斯峡谷的深宽比为全球之最。',
  bridge:'扎戈里那些跨越深谷的石拱桥，与赵州桥出自同一种思路：用最少的石料、最准的弧度，去对抗水与时间。不同的是，扎戈里有上百座，散在群山之间，至今还在走人。',
  food:'伊庇鲁斯是"派"的故乡——不是中东的皮塔饼，而是手擀酥皮包裹野菜、奶酪、南瓜或荨麻的馅饼，每个村子的做法都不一样。邻近的梅措沃出产烟熏 Metsovone 奶酪，以及希腊最早一批正经的酒庄酒 Katogi。在这里，tsipouro 配什么都喝。',
  swap:'伊庇鲁斯距雅典一小时飞行，一整年的国际游客量还不如圣托里尼两周的接待量。八月之外，山村里那些修缮好的石屋客栈，床位大量空着。'}},

{id:'philippi',type:'city',lon:24.41,lat:40.94,pressure:1,dist:5,
 months:'SSGBBGGGBBGS',
 t:{ancient:5,byzantine:4,food:4,nature:2,village:2,art:3,sea:3,living:3},
 en:{name:'Kavala & Philippi',alt:'Καβάλα · Eastern Macedonia',region:'Northern Greece',
  usp:'A tobacco-boom port stacked up a hillside under an Ottoman aqueduct — next door to the battlefield where the Roman Republic ended and the first Christian sermon in Europe was preached.',
  history:'At Philippi in 42 BC, Mark Antony and Octavian defeated Brutus and Cassius, the assassins of Julius Caesar. Both losers killed themselves on the field, and with them the Roman Republic effectively died; Octavian would become Augustus. Ninety years later the apostle Paul arrived and delivered what is recorded as the first Christian sermon on European soil, baptising a purple-dye merchant named Lydia in a stream outside the walls — the first named Christian convert in Europe. Philippi was inscribed by UNESCO in 2016. Kavala itself, ancient Neapolis, grew rich on tobacco in the 19th century; its Kamares aqueduct strides across the old town, and the Imaret, a vast Ottoman almshouse, is now a hotel.',
  food:'Kavala is a mussel town — midia saganaki and midia achnista straight off the boats. The region supplies much of Greece\u2019s eastern olive oil, and nearby Thassos is known for its honey and walnut sweets.',
  swap:'Philippi has world-changing history and virtually no queue. The whole of Eastern Macedonia and Thrace takes in a small share of Greece\u2019s foreign visitors, and it is arguably the country\u2019s most underweighted region.'},
 zh:{name:'卡瓦拉与腓立比',alt:'Kavala & Philippi · 东马其顿',region:'希腊北部',
  usp:'一座因烟草兴盛而沿山坡层层叠起的港口城市，奥斯曼引水渠横跨其上——而隔壁，就是罗马共和国终结的战场，也是欧洲土地上第一场基督教布道的发生地。',
  history:'公元前 42 年的腓立比之战中，安东尼与屋大维击败了刺杀恺撒的布鲁图斯与卡西乌斯。两名败者在战场上自尽，罗马共和国也随之实际终结，屋大维日后成为奥古斯都。九十年后，使徒保罗抵达此地，发表了史载欧洲土地上的第一场基督教布道，并在城外的溪水中为一位名叫吕底亚的紫色染料商人施洗——她是欧洲第一位留下姓名的基督徒。2016 年，腓立比被列入世界遗产。卡瓦拉本身即古代的尼阿波利斯，19 世纪因烟草贸易而暴富；卡马雷斯引水渠横跨老城，而巨大的奥斯曼济贫院 Imaret 如今已改成酒店。',
  bridge:'公元前 42 年的腓立比之战终结了罗马共和国；一百六十年前，中国的垓下之战则开启了汉朝。两场战役相隔不远的年代里，东西方各自完成了一次政治形态的彻底换挡。',
  food:'卡瓦拉是贻贝之城——midia saganaki（奶酪焗贻贝）与清蒸贻贝直接从渔船上端来。这一带供应了希腊东部大量橄榄油，邻近的萨索斯岛则以蜂蜜与核桃甜点闻名。',
  swap:'腓立比握有足以改变世界的历史，却几乎不用排队。整个东马其顿与色雷斯大区，只分到希腊外国游客中极小的一部分，很可能是全国被严重低估的第一名。'}},

{id:'mani',type:'region',lon:22.38,lat:36.67,pressure:2,dist:3,
 months:'SSGBBGGGBBGS',
 t:{ancient:3,byzantine:5,food:4,nature:5,village:5,art:3,sea:4,living:3},
 en:{name:'The Mani',alt:'Μάνη · Laconia & Messenia',region:'Peloponnese',
  usp:'A stone landscape of fortified tower houses built for family feuds, running down to the second-southernmost point of mainland Europe — where the ancients believed the entrance to the underworld stood.',
  history:'The Maniots claimed descent from the Spartans and were never fully subdued by the Ottomans; the mountains were too poor to be worth taking and the clans too well armed. Their towers were built storey by storey during blood feuds, each family racing to build higher than its enemy. The Greek War of Independence is traditionally dated to 17 March 1821, when Petrobey Mavromichalis raised the flag at Areopoli. Hundreds of small Byzantine chapels are scattered across the peninsula, many with frescoes and no lock. At Cape Tainaron, a cave was believed to be the gate through which Heracles dragged Cerberus out of Hades.',
  film:'Before Midnight (2013), the third of Richard Linklater\u2019s Before trilogy, was filmed almost entirely in and around Kardamyli in the Outer Mani. The house used in the film belonged to the travel writer Patrick Leigh Fermor, who settled there in the 1960s; it is now open to visitors.',
  food:'Syglino — pork smoked over sage and orange peel, then preserved in fat, a technique born of a landscape with no refrigeration and little water. Kalamata olives and Messinian olive oil come from the northern end, and pasteli, the honey-and-sesame bar, is claimed here as an ancient Spartan ration.',
  swap:'The Mani has a handful of small hotels and a season that barely exists outside July and August. Visiting in spring, when the wildflowers cover the terraces, supports villages that lose population every year.'},
 zh:{name:'马尼半岛',alt:'The Mani · 拉科尼亚与美塞尼亚',region:'伯罗奔尼撒',
  usp:'一片由家族械斗催生出的石塔楼构成的荒野，一路延伸到欧洲大陆的第二南端——古人相信，冥界的入口就在那里。',
  history:'马尼人自称斯巴达人的后裔，从未被奥斯曼真正征服：这片山地太贫瘠，不值得攻取，而各家族又武装精良。他们的塔楼是在血仇中一层层加盖起来的，每家都要抢着比仇家盖得更高。希腊独立战争的传统起点被定在 1821 年 3 月 17 日——彼得罗贝·马夫罗米哈利斯在阿雷奥波利升起战旗的那一天。半岛上散落着数百座拜占庭小教堂，许多仍有壁画，且从不上锁。在泰纳龙角，有一个洞穴被认为就是赫拉克勒斯把地狱三头犬拖出冥府的那道门。',
  film:'理查德·林克莱特"爱在"三部曲的终章《爱在午夜降临前》（2013）几乎全程在外马尼的卡尔达米利一带拍摄。片中那座宅子属于旅行作家帕特里克·利·弗莫尔，他 1960 年代定居于此，故居如今对公众开放。',
  bridge:'为家族械斗而层层加高的石塔楼，在中国有几乎一模一样的产物：开平碉楼与闽西土楼。三者都诞生于同一个前提——国家的手伸不到这里，安全只能靠自己砌起来。',
  food:'Syglino——用鼠尾草与橙皮熏制、再以油脂封存的猪肉，这种做法生于一个没有冷藏、也缺水的地方。半岛北端出产卡拉马塔橄榄与美塞尼亚橄榄油；而蜂蜜芝麻糖 pasteli，当地人坚称是古斯巴达人的军粮。',
  swap:'马尼只有零星几家小旅馆，七八月之外几乎没有旅游季。在野花铺满梯田的春天前来，能支撑这些每年都在流失人口的村庄。'}},

{id:'naxos',type:'island',lon:25.53,lat:37.10,pressure:3,dist:3,
 months:'LLSGBGGGBBSL',
 t:{ancient:4,byzantine:4,food:5,nature:5,village:5,art:3,sea:5,living:4},
 en:{name:'Naxos',alt:'Νάξος · Cyclades',region:'Cyclades',
  usp:'The largest and only genuinely self-sufficient Cycladic island: mountains, working farms, a Venetian castle quarter and a marble temple doorway that frames the sunset — at roughly half the price of its famous neighbours.',
  history:'The Portara, a freestanding marble doorway on an islet by the port, is all that was built of a 6th-century BC temple to Apollo, abandoned when the tyrant who commissioned it fell. Mount Zas, the highest peak in the Cyclades, is where myth says Zeus was raised by a goat. In the island\u2019s quarries, unfinished kouros statues from the 7th century BC still lie where they cracked and were abandoned, one of them ten metres long, in an olive grove you can walk into. The Venetian Kastro in Naxos Town has been continuously inhabited by the same families for seven hundred years. Ariadne, abandoned by Theseus, was said to have been found on this shore by Dionysus.',
  food:'Naxos makes the Cyclades\u2019 only serious cheeses — graviera with PDO status, plus arseniko and xinomizithra. Its potatoes are a protected product sold across Greece, and kitron, a liqueur distilled from citron leaves, exists nowhere else.',
  swap:'Naxos has more beach, more history and more food than Mykonos, at a fraction of the cost and crowding, and is on the same ferry line. Choosing it instead is the single most effective swap a first-time Cyclades visitor can make.'},
 zh:{name:'纳克索斯',alt:'Naxos · 基克拉泽斯',region:'基克拉泽斯群岛',
  usp:'基克拉泽斯最大、也是唯一真正能自给自足的岛：有山、有真正在耕作的农田、有威尼斯城堡区，还有一道把落日framed其中的大理石神庙之门——价格大约只有邻居名岛的一半。',
  history:'港口旁小岛上那道独立矗立的大理石门 Portara，是公元前 6 世纪一座阿波罗神庙唯一建成的部分——下令修建的僭主倒台后，工程就此停工。基克拉泽斯的最高峰扎斯山，据神话是宙斯被一只山羊哺育长大的地方。岛上的采石场里，公元前 7 世纪未完成的青年立像至今仍躺在开裂当天被弃置的原处，其中一尊长达十米，就在一片可以直接走进去的橄榄林里。纳克索斯城的威尼斯城堡区，七百年来一直由同样那几个家族居住至今。被忒修斯抛弃的阿里阿德涅，传说正是在这片海岸被狄俄尼索斯寻获的。',
  bridge:'采石场里那尊裂开后被就地遗弃的十米石像，与龙门石窟中那些凿到一半便停工的佛龛是同一种遗迹：它们记录的不是完成，而是中断，反而更清楚地显示了古人是怎么干活的。',
  food:'纳克索斯出产基克拉泽斯唯一称得上认真的奶酪：拥有原产地保护的 graviera，以及 arseniko 和 xinomizithra。岛上的土豆是受保护农产品，行销全希腊；用香橼叶蒸馏的 kitron 利口酒，则是别处没有的。',
  swap:'纳克索斯的海滩更多、历史更厚、食物更好，花费与拥挤程度却远低于米克诺斯，而且就在同一条渡轮航线上。对第一次来基克拉泽斯的人来说，换成这里是最有效的一次选择。'}},

{id:'milos',type:'island',lon:24.44,lat:36.72,pressure:3,dist:3,
 months:'LLSGBGGGBBSL',
 t:{ancient:5,byzantine:3,food:4,nature:5,village:4,art:4,sea:5,living:2},
 en:{name:'Milos',alt:'Μήλος · Cyclades',region:'Cyclades',
  usp:'The island a farmer was ploughing when he hit the Venus de Milo — with a volcanic coastline of more than seventy beaches, no two of which look alike.',
  history:'In 1820 a farmer named Yorgos Kentrotas uncovered a marble Aphrodite in a field near Tripiti; within a year it had been acquired for France and it has stood in the Louvre ever since, still missing its arms. Long before that, Milos\u2019 obsidian made it one of the earliest trading centres in the Mediterranean — Melian obsidian blades have been found across the Aegean from 11,000 BC, making this arguably the oldest sea trade route in the world. The island also holds Early Christian catacombs, among the most significant outside Rome. In 416 BC Athens destroyed Milos for refusing to join its alliance; Thucydides\u2019 account of the negotiation, the Melian Dialogue, is still taught as the founding text of political realism.',
  food:'Pitarakia, small fried cheese pies; karpouzopita, a watermelon and honey cake baked in summer; and koufeto, pumpkin simmered with honey and almonds, traditionally served at weddings.',
  swap:'Milos has the volcanic drama people come to Santorini for, with a fraction of the cruise pressure, and the beaches are the point rather than the sunset bar. It is the clearest alternative for anyone whose image of Greece is a caldera.'},
 zh:{name:'米洛斯',alt:'Milos · 基克拉泽斯',region:'基克拉泽斯群岛',
  usp:'一个农夫耕地时一锄头挖出了"米洛的维纳斯"的岛——火山海岸线上散布着七十多片海滩，没有两片是一样的。',
  history:'1820 年，一位名叫肯特罗塔斯的农夫在特里皮提附近的田里挖出了一尊大理石阿佛洛狄忒像；不到一年，它就被法国购得，此后一直陈列在卢浮宫，双臂至今下落不明。而在这更早之前，米洛斯的黑曜石让它成为地中海最早的贸易中心之一——公元前 11000 年的米洛斯黑曜石刀片已在整个爱琴海被发现，这很可能是世界上最古老的海上贸易航线。岛上还有罗马之外最重要的早期基督教地下墓穴之一。公元前 416 年，米洛斯因拒绝加入雅典同盟而被彻底摧毁；修昔底德记录下的那场谈判《米洛斯对话》，至今仍被当作政治现实主义的奠基文本来讲授。',
  bridge:'米洛斯的黑曜石在公元前一万一千年就已行销整个爱琴海，是世界上最早的海上贸易线之一。与之可比的是良渚的玉器网络——同样在文字出现之前，就已经把远方连了起来。',
  food:'Pitarakia 小炸奶酪派；夏天烤制的西瓜蜂蜜蛋糕 karpouzopita；以及 koufeto——南瓜与蜂蜜、杏仁同煮的甜食，传统上用于婚宴。',
  swap:'人们奔赴圣托里尼想看的火山地貌，米洛斯都有，邮轮压力却小得多，而且这里的主角是海滩本身，不是看日落的酒吧。如果你对希腊的印象就是那道火山口，这里是最直接的替代选项。'}},

{id:'sifnos',type:'island',lon:24.72,lat:36.97,pressure:2,dist:2,
 months:'LLSGBGGGBBSL',
 t:{ancient:3,byzantine:4,food:5,nature:4,village:5,art:4,sea:4,living:4},
 en:{name:'Sifnos',alt:'Σίφνος · Cyclades',region:'Cyclades',
  usp:'Greece\u2019s culinary island: the man who wrote the country\u2019s first modern cookbook was born here, and his surname is still the Greek word for "cookbook." People come back for the food.',
  history:'Nikolaos Tselementes published his cookbook in 1910 and reshaped how Greece cooks — for better and worse, since he also added béchamel to moussaka. His name entered the language: a Greek asking for a cookbook asks for a tselementes. Long before that, Sifnos\u2019 gold and silver mines made it the richest island in the Cyclades; it paid an annual gold tithe to Delphi and built a treasury there, whose frieze is among the finest Archaic sculpture surviving. The island has over two hundred churches and a living pottery tradition — the clay cooking vessels used for its signature dishes are still thrown here.',
  food:'Revithada: chickpeas, onion and oil sealed in a clay pot and left overnight in a wood-fired oven, eaten every Sunday after church. Mastelo, lamb or goat cooked in red wine and dill in a ceramic dish. Melopita, a honey and fresh cheese tart. Ambelofasoula, vine-tendril salad in spring.',
  swap:'Sifnos is a two-and-a-half-hour ferry from Athens, has no airport and therefore no mass arrivals, and offers exactly the whitewashed Cycladic village life people fly to Santorini for.'},
 zh:{name:'锡夫诺斯',alt:'Sifnos · 基克拉泽斯',region:'基克拉泽斯群岛',
  usp:'希腊的美食之岛：写出全国第一本现代食谱的人生于此，而他的姓氏至今就是希腊语里"食谱"这个词。人们是为了这里的食物一再回来的。',
  history:'尼古拉奥斯·采莱门特斯 1910 年出版的食谱，重塑了希腊人做菜的方式——有功也有过，因为正是他把白酱加进了慕萨卡。他的名字从此进入语言：希腊人要一本食谱，说的就是"一本 tselementes"。而在更早的年代，锡夫诺斯的金银矿让它成为基克拉泽斯最富的岛，每年向德尔斐缴纳黄金什一税，并在那里建了一座宝库，其浮雕是现存最精美的古风时期雕刻之一。岛上有两百多座教堂，制陶传统至今仍在延续——招牌菜所用的陶锅，依然由本地人拉坯烧制。',
  bridge:'采莱门特斯 1910 年的食谱重塑了希腊人的厨房，其地位约等于袁枚的《随园食单》：一本书之后，一个民族开始用另一种方式谈论吃饭。区别是，采莱门特斯的姓氏直接变成了"食谱"这个词。',
  food:'Revithada：鹰嘴豆、洋葱与橄榄油封进陶罐，在柴火炉里焖一整夜，每个周日做完礼拜后食用。Mastelo：羊肉用红酒与莳萝在陶器中慢煮。Melopita：蜂蜜鲜奶酪挞。春天还有嫩葡萄卷须做的沙拉。',
  swap:'从雅典坐船两个半小时可达，没有机场、因而没有大批空运来的客流，而人们特地飞去圣托里尼想体验的那种白房子村落生活，这里原样都有。'}},

{id:'tinos',type:'island',lon:25.16,lat:37.54,pressure:2,dist:2,
 months:'LLSGBGGGBBSL',
 t:{ancient:2,byzantine:5,food:5,nature:4,village:5,art:5,sea:4,living:5},
 en:{name:'Tinos',alt:'Τήνος · Cyclades',region:'Cyclades',
  usp:'Twenty minutes by boat from Mykonos and a completely different island: forty villages of marble carvers, a thousand Venetian dovecotes, and the most important pilgrimage site in the Orthodox world.',
  history:'The church of Panagia Evangelistria was built in 1823 over an icon found after a nun\u2019s vision, and became the spiritual anchor of the new Greek state. On 15 August, pilgrims climb the road from the port on their hands and knees. The marble craftsmanship of Tinos was inscribed on UNESCO\u2019s Intangible Cultural Heritage list in 2015 — the village of Pyrgos has produced most of Greece\u2019s significant sculptors, and its school of fine arts still teaches carving to teenagers. Under Venetian rule for far longer than its neighbours, Tinos remained substantially Catholic, and Catholic and Orthodox villages still sit side by side. The Venetians also left the dovecotes: over a thousand elaborately latticed stone towers scattered across the terraces.',
  food:'Louza, air-cured pork loin rubbed with spices, sliced paper-thin. Artichokes from Komi, kopanisti and volaki cheeses, and raki. The island now has one of the strongest young restaurant scenes in the Cyclades, built almost entirely on its own produce.',
  swap:'Tinos sits on the same ferry route as Mykonos and takes a small fraction of its visitors. For anyone drawn to Mykonos for the Cycladic look rather than the nightlife, this is the same landscape with its culture intact.'},
 zh:{name:'蒂诺斯',alt:'Tinos · 基克拉泽斯',region:'基克拉泽斯群岛',
  usp:'距米克诺斯二十分钟船程，却是完全不同的一座岛：四十个大理石雕刻村、上千座威尼斯鸽舍，以及东正教世界最重要的朝圣地。',
  history:'1823 年，人们依一位修女的异象找到一幅圣像，并在其上建起了圣母领报教堂，它随即成为新生希腊国家的精神支点。每年 8 月 15 日，朝圣者会从港口一路跪爬上山。2015 年，蒂诺斯的大理石工艺被列入联合国教科文组织人类非物质文化遗产名录——皮尔戈斯村出了希腊绝大多数重要雕塑家，村里的美术学校至今仍在教十几岁的孩子雕刻。由于受威尼斯统治的时间远长于邻岛，蒂诺斯保留了大量天主教人口，天主教村与东正教村至今比邻而居。威尼斯人还留下了鸽舍：上千座石砌镂花塔楼，散落在层层梯田之间。',
  bridge:'蒂诺斯的大理石雕刻被列入人类非物质文化遗产，村里的学校至今在教十几岁的孩子凿石。这与福建惠安的石雕传承几乎是同一套模式：一个村子、一门手艺、师徒相传、靠订单活着。',
  food:'Louza——香料揉过、风干的猪里脊，切得薄如纸。科米村的朝鲜蓟、kopanisti 与 volaki 奶酪，以及 raki 烈酒。如今这里拥有基克拉泽斯最强的年轻餐厅群之一，而且几乎完全建立在本岛物产之上。',
  swap:'蒂诺斯和米克诺斯在同一条渡轮航线上，游客量却只有后者的一小部分。如果你被米克诺斯吸引是因为那种基克拉泽斯的模样、而不是夜生活，这里有同样的风景，且文化未被冲淡。'}},

{id:'chios',type:'island',lon:26.14,lat:38.37,pressure:1,dist:4,
 months:'LSSGBGGGBBSL',
 t:{ancient:3,byzantine:5,food:5,nature:3,village:5,art:5,sea:4,living:5},
 en:{name:'Chios',alt:'Χίος · North Aegean',region:'North Aegean',
  usp:'The only place on earth where mastic trees produce resin — a monopoly Chios has held since antiquity — and a medieval village whose every facade is covered in black-and-white geometric patterns.',
  history:'Mastic, the resin wept by Pistacia lentiscus var. Chia, grows commercially nowhere else despite centuries of attempts; under the Genoese and then the Ottomans, stealing it was punishable by death, and the mastic villages were built as fortified squares with no outward-facing doors. The cultivation of mastic was inscribed on UNESCO\u2019s Intangible Cultural Heritage list in 2014. Pyrgi\u2019s houses are decorated in xysta, a scratched black-and-white geometric plasterwork found nowhere else in Greece. Nea Moni, an 11th-century monastery with mosaics commissioned by a Byzantine emperor, is a UNESCO World Heritage site. Chios also claims to be Homer\u2019s birthplace, and the 1822 massacre of its population by Ottoman forces — painted by Delacroix and now hanging in the Louvre — turned European opinion decisively toward Greek independence.',
  food:'Mastiha appears in everything: chewing gum, liqueur, ice cream, bread, even toothpaste. The island also grows exceptional tangerines in the Kampos, a plain of walled Genoese citrus estates, and makes mastelo cheese grilled in slabs.',
  swap:'Chios receives almost no international leisure visitors despite a 50-minute flight from Athens and a UNESCO monastery, a UNESCO craft and a village unlike anywhere else in Europe. It may be the most underweighted island in Greece.'},
 zh:{name:'希俄斯',alt:'Chios · 北爱琴海',region:'北爱琴海诸岛',
  usp:'全世界唯一能产出乳香树脂的地方——这个垄断希俄斯自古代起就一直握着——以及一座整村外墙都布满黑白几何花纹的中世纪村落。',
  history:'乳香是希俄斯变种乳香黄连木流出的树脂，尽管数百年来各地不断尝试移植，至今仍只有这里能够商业化生产。在热那亚人和其后的奥斯曼统治下，偷采乳香是死罪，乳香村因此被建成不朝外开门的封闭方阵。2014 年，乳香种植被列入人类非物质文化遗产名录。皮尔吉村的房屋外墙采用 xysta 刮花工艺——黑白几何图案的灰泥装饰，全希腊再无第二处。11 世纪的新修道院（Nea Moni）由拜占庭皇帝出资、以镶嵌画闻名，是世界文化遗产。希俄斯还自称是荷马的出生地；而 1822 年奥斯曼军队对岛民的大屠杀，经德拉克洛瓦画成油画、如今挂在卢浮宫，彻底扭转了欧洲舆论、转向支持希腊独立。',
  bridge:'希俄斯的乳香脂（玛斯蒂哈，与中医所说的乳香并非同一物）在中世纪经阿拉伯商人向东流通，走的正是把中国丝绸运向西方的那几条商路。香料与丝绸在同一条路上擦肩而过，方向相反。',
  food:'乳香无处不在：口香糖、利口酒、冰淇淋、面包，甚至牙膏。岛上的坎波斯平原是一片被高墙围起的热那亚柑橘庄园，产出极佳的橘子；另有整块煎烤的 mastelo 奶酪。',
  swap:'距雅典只有 50 分钟飞行，拥有一处世界遗产修道院、一项世界非遗工艺，以及一座全欧洲独一无二的村落——希俄斯的国际休闲游客却几乎为零。它可能是全希腊被低估得最厉害的岛。'}},

{id:'symi',type:'island',lon:27.84,lat:36.61,pressure:2,dist:5,
 months:'LLSGBGGGBBSL',
 t:{ancient:2,byzantine:4,food:4,nature:3,village:5,art:4,sea:5,living:3},
 en:{name:'Symi',alt:'Σύμη · Dodecanese',region:'Dodecanese',
  usp:'A harbour of pastel neoclassical mansions rising in tiers from the water, built on sponge-diving fortunes — and the best shrimp in Greece, eaten whole.',
  history:'In the 19th century Symi was one of the richest ports in the Aegean, with a fleet of sponge divers working the eastern Mediterranean and a shipbuilding trade that supplied the Ottoman navy. The mansions climbing the harbour were built with that money; a protection order means they must still be repainted in the original ochres and blues. The population collapsed from 22,000 to under 2,500 as synthetic sponges and emigration took hold. On 8 May 1945, the German surrender of the entire Dodecanese was signed on Symi, ending the Second World War in Greece. The monastery of Panormitis remains a major pilgrimage destination.',
  food:'Garides Symis — tiny sweet shrimp caught in the deep water off the island, flash-fried and eaten whole, shells and heads included. They exist in this size nowhere else and are not exported.',
  swap:'Symi is reached by ferry from Rhodes rather than directly, which keeps day-trip volume high but overnight stays low. Staying two nights transforms the island after the last boat leaves at five.'},
 zh:{name:'锡米',alt:'Symi · 多德卡尼斯',region:'多德卡尼斯群岛',
  usp:'一座由海绵采集生意堆出来的港口：粉彩色的新古典主义宅邸从水面一层层叠上山坡——还有全希腊最好的虾，连壳带头整只吃下。',
  history:'19 世纪的锡米曾是爱琴海最富庶的港口之一，拥有一支在东地中海作业的海绵潜水船队，还造船供应奥斯曼海军。港口两侧层叠的宅邸就是那时的财富所建；如今有保护条例规定，它们必须仍用最初的赭黄与蓝色重新粉刷。随着合成海绵问世与大规模移民，岛上人口从两万两千跌到不足两千五。1945 年 5 月 8 日，德军交出整个多德卡尼斯群岛的投降书正是在锡米签署的，希腊的二战就此结束。帕诺尔米蒂斯修道院至今仍是重要朝圣地。',
  bridge:'锡米靠海绵潜水致富，潜水员屏息下沉数十米作业。中国合浦自汉代起的采珠业几乎是同一份危险的工作——同样靠屏息，同样让一座港口富起来，也同样在技术变迁后迅速衰落。',
  food:'Garides Symis——岛外深水捕捞的小甜虾，急火油炸后整只吃下，连壳带头。这种尺寸的虾别处没有，也从不外运。',
  swap:'锡米要从罗德岛转渡轮才能抵达，因此一日游客很多、过夜的人很少。住上两晚，你会看见下午五点最后一班船开走之后，这座岛完全变了样。'}},

{id:'chania',type:'island',lon:24.02,lat:35.51,pressure:4,dist:3,
 months:'SSGBBGGGBBGS',
 t:{ancient:4,byzantine:4,food:5,nature:5,village:4,art:4,sea:5,living:5},
 en:{name:'Chania, Crete',alt:'Χανιά · Crete',region:'Crete',
  usp:'A Venetian harbour under the White Mountains, with Europe\u2019s most-walked gorge starting an hour inland and a food culture that behaves like a separate country\u2019s.',
  history:'Chania stands on ancient Kydonia, continuously occupied since the Minoan period. It was Crete\u2019s capital until 1971, and the old town still reads as a palimpsest: a Venetian lighthouse at the harbour mouth, Ottoman minarets, a Jewish quarter with a restored 15th-century synagogue, and Byzantine walls underneath it all. In May 1941 the region was the centre of the Battle of Crete, the first largely airborne invasion in military history; local civilians fought the paratroopers with farm tools, and the resistance that followed tied down German divisions for years. The Samaria Gorge, 16 kilometres through the national park, opens each spring.',
  film:'Zorba the Greek (1964) was shot here; the sirtaki scene in which Anthony Quinn teaches Alan Bates to dance was filmed on the beach at Stavros, on the Akrotiri peninsula outside town. The dance itself was invented for the film — it is not a traditional Greek dance, though it has since become one.',
  food:'Dakos — barley rusk soaked in tomato, topped with mizithra and oregano. Graviera aged in mountain huts, kalitsounia cheese pastries with honey, snails, and raki poured unasked at the end of every meal. Crete\u2019s diet was the original subject of the 1950s study that defined the Mediterranean diet.',
  swap:'Crete absorbs visitors far better than a small island can, but they concentrate on the north coast strip. The south coast — Sfakia, Loutro, Paleochora — is reached by mountain road or boat and is a different island entirely.'},
 zh:{name:'克里特 · 哈尼亚',alt:'Chania, Crete',region:'克里特岛',
  usp:'白山脚下的威尼斯港口，向内陆一小时就是全欧洲被走得最多的峡谷，而这里的饮食文化，几乎自成一个国家。',
  history:'哈尼亚坐落在古代的基多尼亚之上，自米诺斯时期起就从未中断过居住。1971 年之前它一直是克里特的首府，老城至今像一张反复擦写的羊皮纸：港口入口的威尼斯灯塔、奥斯曼宣礼塔、修复后的 15 世纪犹太会堂，以及压在这一切之下的拜占庭城墙。1941 年 5 月，这一带是克里特战役的中心——军事史上第一次以空降为主的入侵。当地平民拿着农具迎战伞兵，此后的抵抗运动牵制了德军数个师长达数年。穿越国家公园的 16 公里萨马利亚峡谷，每年春天开放。',
  film:'《希腊人佐巴》（1964）在此拍摄；安东尼·奎恩教艾伦·贝茨跳舞的那场 sirtaki 戏，就拍于城外阿克罗蒂里半岛的斯塔夫罗斯海滩。有意思的是，这支舞本身是为电影现编的——它原本并非希腊传统舞蹈，只是后来变成了。',
  bridge:'克诺索斯宫所属的米诺斯文明，与二里头文化大致同期。当克里特人在建造带排水系统的多层宫殿时，中原也正出现中国最早的宫城格局——两个文明都在同一个世纪迈进了"国家"的门槛。',
  food:'Dakos——大麦干面包泡上番茄汁，铺上 mizithra 鲜奶酪与牛至。山间小屋里熟成的 graviera 奶酪、淋蜂蜜的 kalitsounia 奶酪酥、蜗牛，以及每餐结束时不点也会端上来的 raki。1950 年代那项定义了"地中海饮食"的研究，最初研究的就是克里特人的吃法。',
  swap:'克里特消化游客的能力远胜小岛，但人群高度集中在北岸那一条带上。南岸的斯法基亚、卢特罗、帕莱奥霍拉，要翻山或坐船才能抵达，完全是另一座岛。'}},

{id:'corfu',type:'island',lon:19.92,lat:39.62,pressure:4,dist:3,
 months:'LSGBBGGGBBSL',
 t:{ancient:2,byzantine:3,food:5,nature:5,village:4,art:5,sea:5,living:4},
 en:{name:'Corfu',alt:'Κέρκυρα · Ionian Islands',region:'Ionian Islands',
  usp:'The one part of Greece the Ottomans never took — so it looks, sounds and above all eats Venetian, with dishes found nowhere else in the country.',
  history:'Corfu withstood four major Ottoman sieges and never fell, held by Venice for four centuries. That continuity is why the old town, UNESCO-listed in 2007, is a Venetian city rather than a Greek one, with two fortresses, arcaded streets called kantounia and an esplanade the French later laid out. Because Corfu was never under Ottoman rule, the Greek Enlightenment took root here first: the Ionian Academy, founded in 1824, was Greece\u2019s first university, and the island\u2019s philharmonic societies still fill the streets with brass bands at Easter, when islanders throw clay pots from balconies. Empress Elisabeth of Austria built the Achilleion palace here; Kaiser Wilhelm II later bought it.',
  film:'The ITV series The Durrells (2016–2019) was filmed across the island, adapted from Gerald Durrell\u2019s memoir of a 1930s childhood in Corfu. Scenes from the James Bond film For Your Eyes Only (1981) were also shot here.',
  food:'Corfiot cooking is Venetian at root and exists nowhere else in Greece: sofrito, veal in garlic and white wine vinegar; pastitsada, rooster in a spiced tomato sauce over thick pasta; bourdeto, fish stewed in cayenne. Kumquats, introduced in the 19th century, are made into liqueur and preserves.',
  swap:'Corfu\u2019s north-east resorts are heavily booked while the interior — Old Perithia, a 14th-century mountain village, the olive terraces, the west coast villages — stays quiet even in August.'},
 zh:{name:'科孚岛',alt:'Corfu · 伊奥尼亚群岛',region:'伊奥尼亚群岛',
  usp:'希腊唯一一块奥斯曼从未攻下的土地——所以它的样子、声音，尤其是味道，都是威尼斯式的，有些菜在全希腊别处根本吃不到。',
  history:'科孚顶住了四次大规模奥斯曼围城，从未陷落，被威尼斯统治了四个世纪。正因为这种连续性，2007 年列入世界遗产的老城更像一座威尼斯城市而非希腊城市：两座要塞、被称作 kantounia 的拱廊窄巷，以及后来由法国人规划的广场。由于从未经历奥斯曼统治，希腊启蒙运动最先在这里扎根：1824 年创立的伊奥尼亚学院是希腊第一所大学；岛上的爱乐社团至今仍在复活节把铜管乐队送上街头，而那一天，居民会从阳台往下摔陶罐。奥地利皇后茜茜在此建了阿喀琉斯宫，后来被德皇威廉二世买下。',
  film:'英国 ITV 剧集《德雷尔一家》（2016–2019）全岛取景，改编自杰拉尔德·德雷尔回忆 1930 年代在科孚度过的童年。007 电影《最高机密》（1981）也有部分场景在此拍摄。',
  bridge:'统治科孚四百年的威尼斯舰队，正是把马可·波罗送向东方的那支力量。科孚老城里的拱廊、要塞与菜谱，都是威尼斯海上帝国留下的实物；而那个帝国另一端的终点，是元大都。',
  food:'科孚菜根子上是威尼斯的，全希腊别无分号：sofrito——蒜与白酒醋烧小牛肉；pastitsada——香料番茄酱汁炖公鸡配粗面；bourdeto——辣椒炖鱼。19 世纪引入的金橘，如今被做成利口酒与蜜饯。',
  swap:'科孚东北部的度假区常年爆满，而岛的内陆——14 世纪山村老佩里西亚、层层橄榄梯田、西岸的村落——即便在八月也依然安静。'}}
];
